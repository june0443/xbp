    <!-- 塊ごとにdivタグで区切るようにしましょう。 -->
    <div>
ファイルのバージョンを管理するためのソフトでSCM(Source Control Management)の一つ。<br>
主に以下の二点の役割を果たしている。<br>
                    <ul>
                        <li>ファイルの状態管理</li>
                        <li>ファイルの変更履歴管理</li>
                    </ul>
しかし、Gitで管理しているファイルであれば、コンピューター上でファイルの編集履歴を管理できるので、<br>
編集前のファイルを残したまま、新しく編集したファイルを保存することができます。<br>
なので古いバージョンから新しいバージョンまでの管理が簡単です。
</div>
